# Static file server for the PHG Labs website. HTTPS, compression and HSTS are handled by Caddy in front.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML always fresh; CSS, JS and images cached for a day
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|svg|png|jpg|webp|ico)$ { add_header Cache-Control "public, max-age=86400"; }
}
