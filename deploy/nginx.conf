# Static file server for the PHG Labs websites. HTTPS, compression and HSTS are handled by Caddy in front.

# phglabs.in (default server)
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The games live on their own subdomain; never serve them twice
    location ^~ /play/ {
        rewrite ^/play/(.*)$ https://play.phglabs.in/$1 permanent;
    }

    # HTML always fresh; CSS, JS and images cached for a day
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|svg|png|jpg|webp|ico)$ { add_header Cache-Control "public, max-age=86400"; }
}

# play.phglabs.in: free games (files in site/play)
server {
    listen 80;
    server_name play.phglabs.in;
    root /usr/share/nginx/html/play;
    index index.html;
    server_tokens off;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Pages always fresh; scripts, styles, puzzle data and the chess engine cached for a day
    location ~* \.(css|js|json|svg|png|wasm|txt)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
